<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://audible-tools.kamsker.at/">
    <script>
      (function () {
        var targetOrigin = "https://audible-tools.kamsker.at";
        var pathname = window.location.pathname.replace(/^\/+/, "");
        var targetUrl = new URL(targetOrigin + "/");

        if (pathname) {
          targetUrl.pathname = "/" + pathname;
        }

        targetUrl.search = window.location.search;
        targetUrl.hash = window.location.hash;

        window.location.replace(targetUrl.toString());
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=https://audible-tools.kamsker.at/">
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f7f7f7;
        color: #111;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }

      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        Redirecting to
        <a href="https://audible-tools.kamsker.at/">audible-tools.kamsker.at</a>.
      </p>
    </main>
  </body>
</html>
